<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overhead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <span class="header-plane" aria-hidden="true">
      <svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
        <path fill="#fff"
          d="M570 60c40 8 66 26 70 46 2 10-2 20-12 30-8 8-22 14-40 16l-52 6c-6 24-24 42-46 42h-14l36-68H350l-84 68c-6 4-14 6-22 6h-30l52-74H120l-56 44c-4 3-9 4-14 4H20l36-52H40c-16 0-28-6-28-14s12-14 28-14h16l-36-52h30c5 0 10 1 14 4l56 44h146l-52-74h30c8 0 16 2 22 6l84 68h162l-36-68h14c22 0 40 18 46 42l52 6c18 2 32 6 40 14z" />
      </svg>
    </span>
    <h1>Overhead</h1>
  </header>

  <main class="content">
    <section class="map-panel" aria-label="Radar map of planes overhead">
      <div id="map"></div>
    </section>

    <aside class="details-panel" aria-label="Flight details">
      <h2 class="details-title">Flight Details</h2>
      <p class="details-empty">No flights in range yet.</p>
      <ul id="flight-list"></ul>
    </aside>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year">2026</span> Gary Hoare</p>
    <p class="footer-note">Flight data for personal use</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="javascript.js"></script>
</body>

</html>
