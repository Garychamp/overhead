<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overhead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <span class="header-plane" aria-hidden="true">
      <img src="Media/Images/flying-clipart-a380-airbus-4081366087.png" alt="">
    </span>
    <h1>Overhead</h1>
  </header>

  <main class="content">
    <section class="map-panel" aria-label="Radar map of planes overhead">
      <div id="map"></div>
    </section>

    <aside class="details-panel" aria-label="Flight details">
      <h2 class="details-title">Flight Details</h2>
      <p class="details-empty">No flights in range yet.</p>
      <ul id="flight-list"></ul>
    </aside>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year">2026</span> Gary Hoare</p>
    <p class="footer-note">All rights reserved.</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="javascript.js"></script>
</body>

</html>
